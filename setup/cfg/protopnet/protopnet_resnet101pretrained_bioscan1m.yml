name: "" 
seed: 0
n_gpus: 1
run:
  dataset:
    name: bioscan1m 
    shape: [224, 224]
    min_samples: 10               # drop labels with fewer rows; changing this or
                                  # rank changes the class count, so model.num_classes
                                  # must be updated to match
    rank: "species"                 # order | family | subfamily | genus | species
    normalize:                    # ImageNet stats, matching the pretrained weights
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    augmentation:                 # online, train split only. 0 disables a step.
      crop: 0.8
      hflip: 0.5                  # plate-mounted specimens: any orientation is valid
      vflip: 0.5
      rotation: 180
      color_jitter: 0.1           # keep mild, pigment is taxonomically informative
    balance: True                 # balances the labels in the dataset
    split: [0.6, 0.2, 0.2]
    train:
      subsample: 1.0
      batch_size: 16
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      shuffle: true
    push:
      subsample: 1.0
      batch_size: 32
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      shuffle: false
    val:
      subsample: 1.0
      batch_size: 32
      num_workers: 8
      persistent_workers: true
      pin_memory: true
    test:
      subsample: 1.0
      batch_size: 32
      num_workers: 8
      persistent_workers: true
      pin_memory: true
  epoch: 0
  warm_epochs: 3
  joint_epochs: 50
  push_every: 10
  last_only_epochs: 5
  model:
    name: "protopnet"
    checkpoint: ""                  # resume a whole ProtoPNet; not a backbone transfer
    backbone_checkpoint: "saved/resnet101_bioscan1m_best/0050/model.pt"         # a resnet trained on this data as a plain classifier;
                                    # fill in before running, e.g. saved/<run>/<epoch>/model.pt
    backbone: "resnet101"
    img_size: 224
    prototype_shape: [5730, 128, 1, 1]
    num_classes: 1146
  loss:
    name: ce
    ce: 1.0
    cluster: 0.8
    separation: -0.08
    l1: 0.0001
    label_smoothing: 0.1
  optimizer:
    warm:
      name: adam
      checkpoint: ''
      addon:
        lr: 0.003
        weight_decay: 0.001
      prototype:
        lr: 0.003
    joint:
      name: adam
      checkpoint: ''
      backbone:
        lr: 0.0001
        weight_decay: 0.01
      addon:
        lr: 0.003
        weight_decay: 0.01
      prototype:
        lr: 0.003
    last_layer:
      name: adam
      checkpoint: ''
      lr: 0.0001
log:
  savedir: ''
  track:
    every: 1
  checkpoint:
    every: 2
    model: true
    optimizer: true
  diagnose:
    every: 5
    weights: true
    gradients: true
  wandb:
    enabled: false
    entity: bahngmc-duke-university
    project: ripe-overfit-sweep
