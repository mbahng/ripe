# Debugger-friendly copy of protopnet_resnet18fresh_bioscan1m_test.yml.
# num_workers: 0 everywhere so __getitem__, the collate and the transforms run in
# the main process, where breakpoints actually land. It is also the only way to
# debug this project safely: debugpy attaches a session to every forked worker, and
# four loaders x 8 workers overwhelms the adapter. persistent_workers must be false
# because PyTorch rejects true with no workers.
name: "" 
seed: 0
n_gpus: 1
run:
  dataset:
    name: bioscan1m 
    shape: [224, 224]
    min_samples: 231             # drop labels with fewer rows; changing this or
                                  # rank changes the class count, so model.num_classes
                                  # must be updated to match
    rank: "species"                 # order | family | subfamily | genus | species
    normalize:                    # ImageNet stats, matching the pretrained weights
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    augmentation:                 # online, train split only. 0 disables a step.
      crop: 0.8
      hflip: 0.5                  # plate-mounted specimens: any orientation is valid
      vflip: 0.5
      rotation: 180
      color_jitter: 0.1           # keep mild, pigment is taxonomically informative
    balance: True                 # balances the labels in the dataset
    split: [0.6, 0.2, 0.2]
    train:
      subsample: 0.3
      batch_size: 8
      num_workers: 0
      pin_memory: false
      persistent_workers: false
      shuffle: true
    push:
      subsample: 0.3
      batch_size: 8
      num_workers: 0
      pin_memory: false
      persistent_workers: false
      shuffle: false
    val:
      subsample: 0.3
      batch_size: 8
      num_workers: 0
      persistent_workers: false
      pin_memory: false
    test:
      subsample: 0.3
      batch_size: 8
      num_workers: 0
      persistent_workers: false
      pin_memory: false
  epoch: 0
  warm_epochs: 5
  joint_epochs: 50
  push_every: 10
  last_only_epochs: 5
  model:
    name: "protopnet"
    checkpoint: ""
    backbone: "resnet18"
    img_size: 224
    prototype_shape: [250, 128, 1, 1]
    num_classes: 50
  loss:
    name: ce
    ce: 1.0
    cluster: 0.8
    separation: -0.08
    l1: 0.0001
    label_smoothing: 0.1
  optimizer:
    warm:
      name: adam
      checkpoint: ''
      addon:
        lr: 0.003
        weight_decay: 0.001
      prototype:
        lr: 0.003
    joint:
      name: adam
      checkpoint: ''
      backbone:
        lr: 0.0001
        weight_decay: 0.01
      addon:
        lr: 0.003
        weight_decay: 0.01
      prototype:
        lr: 0.003
    last_layer:
      name: adam
      checkpoint: ''
      lr: 0.0001
log:
  savedir: ''
  track:
    every: 1
  checkpoint:
    every: 2
    model: true
    optimizer: true
  diagnose:
    every: 5
    weights: true
    gradients: true
  wandb:
    enabled: true
    entity: bahngmc-duke-university
    project: ripe-overfit-sweep
