name: ""
seed: 0
n_gpus: 1
run:
  dataset:
    name: bioscan1m
    rank: species
    min_species_samples: 10
    split_strategy: stratified
    split:
    - 0.6
    - 0.2
    - 0.2
    seed: 0
    oversample: 1.0
    augmentation:
      hflip: 0.5
      vflip: 0.5
      rotation: 180
      crop:
      - 0.6
      - 1.0
      color_jitter: 0.2
    train:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
      shuffle: true
    push:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
      shuffle: false
    val:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
    test:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
  epoch: 0
  total_epochs: 25
  model:
    name: resnet50
    checkpoint: ''
    num_classes: 1146
  loss:
    name: ce
    ce: 1.0
    label_smoothing: 0.1
  optimizer:
    all:
      name: adam
      checkpoint: ''
      lr: 0.0001
      weight_decay: 0.01
log:
  savedir: ''
  track:
    every: 1
  checkpoint:
    every: 2
    model: true
    optimizer: true
  diagnose:
    every: 5
    weights: true
    gradients: true
  wandb:
    enabled: true
    entity: bahngmc-duke-university
    project: ripe-overfit-sweep

