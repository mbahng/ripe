name: "resnet34_bioscan1m_best"
# Best trial of sweep b3fsp5l5 (run 3if4af2d) by val.accuracy; the
# learning rate, momentum, weight decay and augmentation below are its values.
seed: 0
n_gpus: 1                         # 0 = cpu, 1 = cuda:0, >1 = multi-gpu setup

run:
  dataset:
    name: "bioscan1m"
    shape: [224, 224]             # what the ImageNet-pretrained resnet34 expects
    min_samples: 10               # drop labels with fewer rows; changing this or
                                  # rank changes the class count, so model.num_classes
                                  # must be updated to match
    rank: "species"                 # order | family | subfamily | genus | species
    normalize:                    # ImageNet stats, matching the pretrained weights
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    augmentation:                 # online, train split only. 0 disables a step.
      crop: 0.8
      hflip: 0.5                  # plate-mounted specimens: any orientation is valid
      vflip: 0.5
      rotation: 180
      color_jitter: 0.3           # keep mild, pigment is taxonomically informative
    balance: True                 # balances the labels in the dataset
    split: [0.6, 0.2, 0.2]
    train:
      subsample: 1.0
      batch_size: 64
      num_workers: 8
      persistent_workers: True
      pin_memory: True
      shuffle: True
    val:
      subsample: 1.0
      batch_size: 128
      num_workers: 8
      persistent_workers: True
      pin_memory: True
    test:
      subsample: 1.0
      batch_size: 128
      num_workers: 8
      persistent_workers: True
      pin_memory: True

  epoch: 0
  total_epochs: 50

  model:
    name: "resnet34"
    checkpoint: ""
    num_classes: 1146               # insect orders with >= min_samples rows

  loss:
    name: "ce"
    l1: 0.0
    label_smoothing: 0.0

  optimizer:
    all:
      name: "sgd"
      checkpoint: ""
      lr: 5.902738003782161e-05
                                    # CrossEntropy reduces by sum, so the gradient
                                    # scales with batch_size: equivalent to 3.78e-03
                                    # under mean reduction at batch_size 64.
      momentum: 0.95
      betas: [0.9, 0.999]
      weight_decay: 0.001

log:
  savedir: ""
  track:
    every: 1
  checkpoint:
    every: 1
    model: True
    optimizer: True
  diagnose:
    every: 1
    save_local: True

    weights: True
    gradients: True
    sample: True
  wandb:
    enabled: True
    entity: "bahngmc-duke-university"
    project: "ripe"
