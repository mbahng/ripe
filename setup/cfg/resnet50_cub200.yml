name: resnet50_cub200_v2
seed: 0
n_gpus: 1
run:
  dataset:
    name: cub200
    split:
    - 0.6
    - 0.2
    - 0.2
    train:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
      shuffle: true
    push:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
      shuffle: false
    val:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
    test:
      subsample: 1.0
      batch_size: 64
      num_workers: 4
      pin_memory: true
  epoch: 0
  total_epochs: 30
  model:
    name: resnet50
    checkpoint: ''
    num_classes: 200
  loss:
    name: ce
    ce: 1.0
    label_smoothing: 0.1
  optimizer:
    all:
      name: adam
      checkpoint: ''
      lr: 0.0001
      weight_decay: 0.01
log:
  savedir: ''
  track:
    every: 1
  checkpoint:
    every: 2
    model: true
    optimizer: true
  diagnose:
    every: 5
    weights: true
    gradients: true
  wandb:
    enabled: true
    entity: bahngmc-duke-university
    project: ripe-overfit-sweep
