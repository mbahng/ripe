name: prototree_resnet18_bioscan1m
base_config: setup/cfg/prototree/prototree_resnet18_bioscan1m.yml
entity: bahngmc-duke-university
project: multimodal_protopnets
method: bayes
metric:
  name: postpush_val.hard_balanced_accuracy
  goal: maximize
parameters:
  run.optimizer.joint.addon.lr:
    distribution: log_uniform_values
    min: 5.0e-05
    max: 0.0005
  run.optimizer.warm.addon.lr:
    distribution: log_uniform_values
    min: 5.0e-05
    max: 0.0005
  run.optimizer.joint.prototype.lr:
    distribution: log_uniform_values
    min: 0.002
    max: 0.05
  run.optimizer.joint.backbone.lr:
    distribution: log_uniform_values
    min: 3.0e-06
    max: 3.0e-05
  run.joint_epochs:
    value: 35
  run.warm_epochs:
    value: 15
  run.model.k_for_topk:
    values:
    - 3
    - 5
    - 9
  run.model.depth:
    value: 10
  run.loss.variability:
    distribution: uniform
    min: -0.5
    max: -0.01
  run.loss.orthogonality:
    distribution: log_uniform_values
    min: 0.1
    max: 3.0
  run.dataset.augmentation.crop:
    value: 0.8
  run.dataset.augmentation.color_jitter:
    value: 0.1
  run.push.every:
    value: 1
  run.push.visualize:
    value: true
  run.convergence.metric:
    value: postpush_val.hard_balanced_accuracy
  run.convergence.min_delta:
    value: 0.002
  run.convergence.patience:
    value: 20
  log.abandon.epoch:
    value: 14
  log.abandon.metric:
    value: postpush_val.hard_balanced_accuracy
  log.abandon.below:
    value: 0.08
  run.push.visualize_every:
    value: 10
